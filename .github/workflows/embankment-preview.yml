name: Embankment Agent Desktop preview
on:
  push:
    branches: [embankment/agentdesktop-reauth-preview]
permissions:
  contents: read
env:
  AGENTDESKTOP_VERSION: "0.6.1"
  CARGO_TERM_COLOR: always
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win
            extension: msi
          - runner: macos-26
            target: aarch64-apple-darwin
            platform: mac
            extension: pkg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: frontend/.nvmrc
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - name: Build preview installer
        shell: bash
        working-directory: frontend
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm --filter @agentdesktop/desktop-web "dist:${{ matrix.platform }}" -- --target "${{ matrix.target }}"
      - name: Verify Windows upgrade from official v0.6.0
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/agentdesktop-dev/agentdesktop/releases/tags/v0.6.0
          $asset = @($release.assets | Where-Object name -eq 'agentdesktop-windows-amd64.msi')
          if ($asset.Count -ne 1) { throw 'Expected one official Windows x64 MSI' }
          $official = Join-Path $env:RUNNER_TEMP 'agentdesktop-official.msi'
          Invoke-WebRequest $asset[0].browser_download_url -OutFile $official
          if ((Get-AuthenticodeSignature $official).Status -ne 'Valid') { throw 'Official MSI signature is invalid' }
          $preview = @(Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi)
          if ($preview.Count -ne 1) { throw 'Expected one preview MSI' }
          function Install-Msi($path) {
            $process = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $path + '"'), '/qn', '/norestart') -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "MSI failed with exit $($process.ExitCode)" }
            (Get-Service AgentDesktop).WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          }
          Install-Msi $official
          $config = "$env:ProgramData\AgentDesktop\config.yaml"
          $hash = (Get-FileHash $config).Hash
          $marker = "$env:ProgramData\AgentDesktop\state\embankment-preview-test-marker"
          New-Item -ItemType Directory -Force (Split-Path $marker) | Out-Null
          Set-Content $marker 'preserve on upgrade'
          Install-Msi $preview[0].FullName
          if ((Get-FileHash $config).Hash -ne $hash) { throw 'Upgrade changed machine configuration' }
          if ((Get-Content $marker) -ne 'preserve on upgrade') { throw 'Upgrade lost daemon state' }
          $app = "$env:ProgramFiles\Agent Desktop\agentdesktop.exe"
          & .github/scripts/verify-windows-version.ps1 -Path @($app, "$env:ProgramFiles\Agent Desktop\agentdesktop-service.exe") -Version $env:AGENTDESKTOP_VERSION
          & $app status
          if ($LASTEXITCODE -ne 0) { throw 'Installed client could not reach the service' }
      - name: Upload preview installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agentdesktop-preview-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/${{ matrix.extension }}/*.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7
